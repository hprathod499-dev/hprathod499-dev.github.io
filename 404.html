ય, તો એને null ન રહેવા દેશો — .json ફાઈલની "designations" array માં નવી entry ઉમેરો (ફોર્મેટ: { "id": "<નવો id>", "label": "<જેમ લખેલું છે એમ જ label>" }, જે id હાલના કોઈ id સાથે ટકરાય નહીં) અને એ નવો id એ વ્યક્તિ માટે વાપરો. જો એક કરતાં વધુ સ્ટાફનો સરખો નવો હોદ્દો હોય તો એક જ નવી entry ફરીથી વાપરો, ડુપ્લિકેટ ન બનાવો.\n4. "designation" ને null ફક્ત ત્યારે જ રહેવા દો જ્યારે મહેકમ પત્રમાં એ વ્યક્તિ માટે કોઈ હોદ્દો લખેલો જ ન હોય — ક્યારેય અંદાજો ન લગાવો, અને નવો હોદ્દો ઉમેરવાને બદલે સૌથી નજીક લાગતું હાલનું label પણ ન પસંદ કરો.\n5. Final કરતા પહેલા, દરેક વ્યક્તિને બીજી વાર ફરીથી તપાસો — assign કરેલ designation id (હાલનું હોય કે નવું ઉમેરેલું), મહેકમ પત્રમાં ખરેખર શું લખ્યું છે એની સામે ફરીથી ચેક કરો — હમણાં જ કોઈ mismatch પકડીને સુધારો, મારા માટે શોધવા ન છોડો.\n"phone" બાબતે પણ કડક રહેજો: મહેકમ પત્રમાં મોબાઈલ નંબર ઘણી વાર આગળ "+91", "91", અથવા "0" સાથે લખેલા હોય છે — પણ આ પ્રિફિક્સ ત્યારે જ કાઢો જ્યારે કુલ અંક 10 થી વધારે હોય (આગળ "0" સાથે 11 અંક, અથવા "91"/"+91" સાથે 12 અંક). જો નંબર પહેલેથી જ બરાબર 10 અંકનો હોય, તો એને એમ જ રહેવા દો — ભલે એ 10 અંક પોતે "91" થી શરૂ થતા હોય (દા.ત. "9102345673") — એ સાચો નંબર જ છે, country code નથી, અને કાઢી નાખવાથી ખોટી રીતે ફક્ત 8 અંક બચી જશે. આટલું કર્યા પછી, એ સાચો 10 અંકનો ભારતીય મોબાઈલ નંબર જ હોવો જોઈએ (બરાબર 10 અંક, અને શરૂઆત 6, 7, 8 કે 9 થી થતી હોય). જો બાકી રહેલો નંબર ખોટી લંબાઈનો હોય, બીજા અંકથી શરૂ થતો હોય, કે સ્પષ્ટપણે યોગ્ય મોબાઈલ નંબર ન લાગે, તો "phone" ને null જ રહેવા દો, બળજબરીથી ભરશો નહીં.\nછેલ્લે મને કહો: કેટલા સ્ટાફને designation મળ્યું, કેટલાને null રહ્યું (એમના બકલ નંબર સાથે), તમે કઈ-કઈ નવી designations ઉમેરી, અને અમાન્ય લાગવાથી કેટલા phone number null રહ્યા.\nમને સંપૂર્ણ, અપડેટેડ .json ફાઈલ download કરવા માટે પાછી આપો.':'I\'m sending my Duty Roster app\'s .json backup file, plus a PDF/Word file listing police station staff (buckle number, mobile number, name, designation) — called the "મહેકમ પત્ર". Please read the staff file and add each person as a new entry inside the "staff" object of the .json file — keyed by buckle number as a string — using this exact shape, and leave every other part of the .json file exactly as it already is:\n"<buckleNumber>": { "number": "<buckleNumber>", "name": "<name>", "phone": "<10-digit mobile number, or null if missing>", "designation": "<designation id, or null>", "unavailable": null }\nBuckle number and mobile number must be plain English digits (0-9) only. Name must stay in Gujarati script.\nBe strict about "designation" — this is the part I most need double-checked:\n1. First list every distinct "label" already present in the .json file\'s "designations" array, so you have the exact allowed set.\n2. For each staff member, match their designation from the PDF/Word file against that exact set of labels — same abbreviation, case-insensitive, ignoring only extra spaces. Do not treat similar-looking or partially-matching labels as a match.\n3. If a person\'s designation is clearly stated in the PDF/Word file but doesn\'t match any existing label, don\'t leave it null — add it as a new entry to the "designations" array in the .json file (shape: { "id": "<new-id>", "label": "<exact label as written>" }, with a new id that doesn\'t collide with any existing id) and use that new id for them. Reuse the same new designation entry (don\'t create duplicates) if multiple staff share that same new designation.\n4. Only leave "designation" as null if the PDF/Word file simply doesn\'t state a designation for that person — never guess, never pick the closest-sounding existing label instead of adding a new one.\n5. Before finalizing, go back through every person a second time and re-check each assigned designation id (existing or newly added) against what the PDF/Word file actually says for them — catch and fix any mismatch now, don\'t leave it for me to find.\nBe strict about "phone" too: mobile numbers in the મહેકમ પત્ર are often written with a leading "+91", "91", or "0" — but only strip that prefix when there are MORE than 10 digits to begin with (11 dig dyEn:'"By work type" assigns to whoever\'s next automatically. "Group duty" assigns the same duty to several people at once (e.g. a whole team for an event). "Miscellaneous" is for a one-off task that doesn\'t need its own permanent work type — you describe what it actually is. "Record Leave" logs leave for one or more people without assigning any duty.',bodyGu:'"કામના પ્રકાર પ્રમાણે" આપમેળે વારા પ્રમાણેની વ્યક્તિને સોંપે છે. "ગ્રુપ ડ્યુટી" એક જ ડ્યુટી એકસાથે ઘણા લોકોને સોંપે છે (દા.ત. કોઈ પ્રસંગ માટે આખી ટીમ). "વિવિધ" એક વખતના કામ માટે છે જેને કાયમી કામનો પ્રકાર જરૂરી નથી — તમે એ ખરેખર શું છે તે વર્ણવો છો. "રજા નોંધો" કોઈ ડ્યુટી સોંપ્યા વગર એક કે વધુ લોકોની રજા નોંધે છે.'},{titleEn:"How do I add or manage staff?",titleGu:"હું સ્ટાફ કેવી રીતે ઉમેરું અથવા સંચાલિત કરું?",bodyEn:"Add a person once here, by their buckle number — they're then available to add to any work type. Leave, outstation, and designation are all set here too, and apply everywhere that person is on a roster. Adding a lot of people at once (a whole station's staff, 100+ names)? Typing each one in by hand is the slow way — use the \"📥 Import Staff\" option instead (shows right here on Manage Staff for a brand-new account, or anytime under Settings → Data): it gives you a ready-made prompt to hand to Claude along with a staff-details PDF/Word file, and Claude sends back a ready-to-restore backup file with everyone already added.",bodyGu:'અહીં એક વખત વ્યક્તિને તેમના બકલ નંબરથી ઉમેરો — પછી તેમને કોઈપણ કામના પ્રકારમાં ઉમેરી શકાય છે. રજા, બહારગામ અને હોદ્દો પણ અહીંથી જ સેટ થાય છે, અને તે વ્યક્તિ જ્યાં પણ રોસ્ટરમાં હોય ત્યાં લાગુ પડે છે. એકસાથે ઘણા બધા (આખા સ્ટેશનનો સ્ટાફ, 100+ નામ) ઉમેરવા છે? દરેકને જાતે ટાઈપ કરવું ધીમો રસ્તો છે — તેના બદલે "📥 સ્ટાફ આયાત કરો" વાપરો (નવા એકાઉન્ટ માટે અહીં મેનેજ સ્ટાફ પર જ દેખાય છે, અથવા ગમે ત્યારે સેટિંગ્સ → ડેટા હેઠળ): તે તમને Claude ને આપવા માટે તૈયાર prompt આપે છે, સાથે સ્ટાફ-ડિટેલ્સ વાળી PDF/Word ફાઈલ મોકલો, અને Claude બધા ઉમેરાયેલા સાથે તૈયાર બેકઅપ ફાઈલ પાછી મોકલે છે.',goTo:{mode:"staff"}},{titleEn:"How do I add new leave types, designations, or outstation types?",titleGu:"નવા રજા પ્રકારો, હોદ્દાઓ કે બહારગામ પ્રકારો કેવી રીતે ઉમેરવા?",bodyEn:'All three are managed from Manage Staff — scroll down to the Leave types, Outstation types, and Designations sections there. Each has its own "+ Add" control; once added, the new one is immediately available anywhere that type is picked (assigning leave, outstation, or a designation to a person).',bodyGu:'ત્રણેય મેનેજ સ્ટાફ પરથી સંચાલિત થાય છે — ત્યાં નીચે સ્ક્રોલ કરીને રજા પ્રકારો, બહારગામ પ્રકારો અને હોદ્દાઓ વિભાગો જુઓ. દરેકનું પોતાનું "+ ઉમેરો" નિયંત્રણ છે; ઉમેર્યા પછી, નવો પ્રકાર તરત જ ગમે ત્યાં (વ્યક્તિને રજા, બહારગામ કે હોદ્દો સોંપતી વખતે) પસંદ કરવા માટે ઉપલબ્ધ થાય છે.',goTo:{mode:"staff"}},{titleEn:"What's the difference between Leave and Outstation?",titleGu:"રજા અને બહારગામ વચ્ચે શું તફાવત છે?",bodyEn:'Both make someone unavailable for duty during their dates, but are tracked and labeled separately (e.g. Casual Leave vs Training) so History and reports show the real reason, not just "unavailable."',bodyGu:'બંને તેમની તારીખો દરમિયાન વ્યક્તિને ડ્યુટી માટે અનુપલબ્ધ બનાવે છે, પરંતુ અલગ-અલગ ટ્રેક અને લેબલ થાય છે (દા.ત. કેઝ્યુઅલ લીવ વિરુદ્ધ તાલીમ) જેથી ઇતિહાસ અને અહેવાલોમાં ફક્ત "અનુપલબ્ધ" નહીં, વાસ્તવિક કારણ દેખાય.'},{titleEn:'What does "Skip" actually do?',titleGu:'"સ્કિપ" ખરેખર શું કરે છે?',bodyEn:'Marking someone "Skip" takes them out of the rotation for that work type without touching their waiting time — use it for someone temporarily unfit for THIS work type specifically, not full leave. A note is required, and it\'s logged in Skip history.',bodyGu:'કોઈને "સ્કિપ" કરવાથી તેમનો રાહ જોવાનો સમય બદલાયા વગર તેઓ તે કામના પ્રકારના રોટેશનમાંથી બહાર થાય છે — ખાસ કરીને આ કામના પ્રકાર માટે અસ્થાયી રૂપે અયોગ્ય વ્યક્તિ માટે વાપરો, પૂરી રજા માટે નહીં. નોંધ જરૂરી છે, અને તે સ્કિપ ઇતિહાસમાં નોંધાય છે.'},{titleEn:"How does sharing the roster work?",titleGu:"રોસ્ટર શેર કરવાનું કેવી રીતે કામ કરે છે?",bodyEn:'Turning Share on (top toolbar) gives you a link anyone can open without signing in — read-only, no edit access, and it only ever shows a safe subset of your data (no phone numbers). That view now has its own "📅 Duty calendar" button right in its toolbar too, so whoever you share it with can jump straight to the calendar without hunting for it. Turning Share off revokes the link immediately.',bodyGu:'શેર ચાલુ કરવાથી (ટોચનું ટૂલબાર) તમને એક લિંક મળે છે જે કોઈપણ સાઇન-ઇન વગર ખોલી શકે છે — ફક્ત-જોવા માટે, સંપાદન પ્રવેશ નહીં, અને તે હંમેશા તમારા ડેટાનો ફક્ત સુરક્ષિત ભાગ જ બતાવે છે (ફોન નંબર નહીં). એ દૃશ્યના ટૂલબારમાં હવે પોતાનું "📅 ડ્યુટી કૅલેન્ડર" બટન પણ છે, જેથી તમે જેની સાથે શેર કરો તે વ્યક્તિ સીધું કૅલેન્ડર પર જઈ શકે, શોધ્યા વગર. શેર બંધ કરવાથી લિંક તરત જ રદ થાય છે.'},{titleEn:"Can I download a PDF report?",titleGu:"શું હું PDF અહેવાલ ડાઉનલોડ કરી શકું?",bodyEn:"Every work type, the Monthly report, and each person's own history can be downloaded as a PDF — pick a time period first (This month, Last 3 months, etc.) so the export matches what you actually need.",bodyGu:"દરેક કામનો પ્રકાર, માસિક અહેવાલ, અને દરેક વ્યક્તિનો પોતાનો ઇતિહાસ PDF તરીકે ડાઉનલોડ કરી શકાય છે — પહેલાં સમયગાળો પસંદ કરો (આ મહિને, છેલ્લા 3 મહિના, વગેરે) જેથી એક્સપોર્ટ તમને ખરેખર જોઈએ છે તે સાથે મેળ ખાય."},{titleEn:"How is my data backed up?",titleGu:"મારો ડેટા કેવી રીતે બેકઅપ થાય છે?",bodyEn:'Your data saves automatically as you work. "Data" (top toolbar) lets you download a local backup file, restore from one, or connect Google Drive for an automatic daily backup — the fastest route to any of that. The same backup-folder and recover-local-data options also live under Settings → Data, alongside Import Staff, if that\'s easier to find. Note: "Format all data" only clears duty history older than 1 month now — the last month is always kept, and a full safety backup downloads automatically the moment you confirm it, before anything is cleared.',bodyGu:'તમે કામ કરો છો ત્યારે તમારો ડેટા આપમેળે સચવાય છે. ટોચના ટૂલબારમાં "ડેટા" તમને સ્થાનિક બેકઅપ ફાઇલ ડાઉનલોડ કરવા, તેમાંથી પુનઃસ્થાપિત કરવા, અથવા દૈનિક ઓટો-બેકઅપ માટે Google Drive જોડવા દે છે — આ માટેનો સૌથી ઝડપી રસ્તો. એ જ બેકઅપ-ફોલ્ડર અને recover-local-data વિકલ્પો Settings → ડેટા હેઠળ પણ છે, Import Staff ની બાજુમાં, જો એ શોધવું સહેલું લાગે. નોંધ: "બધો ડેટા ફોર્મેટ કરો" હવે ફક્ત 1 મહિનાથી જૂનો ડ્યુટી ઇતિહાસ સાફ કરે છે — છેલ્લો મહિનો હંમેશા સચવાય છે, અને તમે પુષ્ટિ કરો કે તરત જ, કંઈપણ સાફ થાય એ પહેલાં, એક સંપૂર્ણ સલામતી બેકઅપ આપમેળે ડાઉનલોડ થાય છે.'},{titleEn:"What do I do if data seems missing?",titleGu:"ડેટા ગુમ થયેલો લાગે તો શું કરવું?",bodyEn:'First, tap "🔄 Sync" (top toolbar) — sometimes it\'s just a connection hiccup making current data look missing, not an actual loss, and Sync tells you plainly which one it is. If it\'s genuinely gone, try these in order: (1) Undo (top toolbar) if it just happened. (2) Profile → Settings → "🛟 Recover local data" — an automatic snapshot saved on this device from the last time it successfully loaded your real data. (3) Data → "Restore" — if you\'ve ever downloaded a backup file (manually, or automatically into a chosen folder). (4) Data → "Google Drive" — if connected, it keeps a daily backup there. (5) Check another device signed into the same account — if the data is fine there, this device just hasn\'t synced yet, and simply reopening the app here should catch it up.',bodyGu:'પહેલા "🔄 સિંક" પર ટેપ કરો (ટોચનું ટૂલબાર) — ક્યારેક તે ફક્ત જોડાણની સમસ્યા હોય છે જે હાલનો ડેટા ગુમ થયેલો દેખાડે છે, ખરેખર ગુમ થયેલો નથી, અને સિંક તમને સ્પષ્ટ રીતે કહે છે કે તે કયું છે. જો તે ખરેખર ગુમ થયો હોય, તો આ ક્રમમાં અજમાવો: (1) જો હમણાં જ થયું હોય તો પૂર્વવત્ (ટોચનું ટૂલબાર). (2) પ્રોફાઇલ → સેટિંગ્સ → "🛟 સ્થાનિક ડેટા પુનઃપ્રાપ્ત કરો" — આ ડિવાઇસ પર છેલ્લે તમારો વાસ્તવિક ડેટા સફળતાપૂર્વક લોડ થયો ત્યારનો આપમેળે સચવાયેલો સ્નેપશોટ. (3) ડેટા → "પુનઃસ્થાપિત કરો" — જો તમે ક્યારેય બેકઅપ ફાઇલ ડાઉનલોડ કરી હોય (જાતે, અથવા પસંદ કરેલા ફોલ્ડરમાં આપમેળે). (4) ડેટા → "Google Drive" — જો જોડાયેલ હોય, તો તે ત્યાં દૈનિક બેકઅપ રાખે છે. (5) એ જ ખાતામાં સાઇન-ઇન થયેલ બીજું ડિવાઇસ તપાસો — જો ત્યાં ડેટા બરાબર હોય, તો આ ડિવાઇસ હજુ સિંક થયું નથી, અને ફક્ત અહીં એપ ફરી ખોલવાથી તે અપડેટ થઈ જવું જોઈએ.'}],we=[{titleEn:'What does "View only" mean?',titleGu:'"ફક્ત જોવા માટે" નો અર્થ શું છે?',bodyEn:"You're seeing a live, read-only copy of the roster — no sign-in needed, and nothing here can be edited, assigned, or changed from this view.",bodyGu:"તમે રોસ્ટરની જીવંત, ફક્ત-જોવા માટેની નકલ જોઈ રહ્યા છો — સાઇન-ઇનની જરૂર નથી, અને આ દૃશ્યમાંથી કંઈપણ સંપાદિત, સોંપી કે બદલી શકાતું નથી."},{titleEn:"How does rotation work?",titleGu:"રોટેશન કેવી રીતે કામ કરે છે?",bodyEn:"Every work type has its own ranked list. Whoever has waited the longest since their last duty in that work type is always next — never a manual pick.",bodyGu:"દરેક કામના પ્રકારની પોતાની ક્રમાંકિત યાદી હોય છે. તે કામના પ્રકારમાં છેલ્લી ડ્યુટી પછી સૌથી લાંબા સમયથી રાહ જોનાર વ્યક્તિનો જ વારો હંમેશા આગળ હોય છે — ક્યારેય મેન્યુઅલ પસંદગી નહીં."},{titleEn:"What's the difference between Leave and Outstation?",titleGu:"રજા અને બહારગામ વચ્ચે શું તફાવત છે?",bodyEn:'Both mean someone is unavailable for duty during those dates, but they\'re tracked and labeled separately (e.g. Casual Leave vs Training) so History shows the real reason, not just "unavailable."',bodyGu:'બંનેનો અર્થ એ છે કે વ્યક્તિ તે તારીખો દરમિયાન ડ્યુટી માટે અનુપલબ્ધ છે, પરંતુ તે અલગ-અલગ ટ્રેક અને લેબલ થાય છે (દા.ત. કેઝ્યુઅલ લીવ વિરુદ્ધ તાલીમ) જેથી ઇતિહાસમાં ફક્ત "અનુપલબ્ધ" નહીં, વાસ્તવિક કારણ દેખાય.'},{titleEn:'What does it mean if someone shows "Skip"?',titleGu:'કોઈને "સ્કિપ" બતાવવાનો અર્થ શું છે?',bodyEn:"It means they were temporarily left out of that specific work type's rotation for a reason, without it counting as their turn — different from leave or outstation. The reason is recorded in Skip history.",bodyGu:"તેનો અર્થ એ છે કે તેમને કોઈ કારણસર તે ચોક્કસ કામના પ્રકારના રોટેશનમાંથી અસ્થાયી રૂપે બહાર રાખવામાં આવ્યા હતા, અને તે તેમનો વારો ગણાતો નથી — રજા કે બહારગામથી અલગ. કારણ સ્કિપ ઇતિહાસમાં નોંધાયેલું છે."},{titleEn:"What are Roster, Fairness, and History?",titleGu:"રોસ્ટર, ન્યાયીપણું અને ઇતિહાસ શું છે?",bodyEn:"Roster shows everyone in rotation order for that work type. Fairness compares how evenly duties are spread across people. History lists every past duty, with dates and notes.",bodyGu:"રોસ્ટર તે કામના પ્રકાર માટે બધાને રોટેશન ક્રમમાં બતાવે છે. ન્યાયીપણું લોકોમાં ડ્યુટી કેટલી સરખી રીતે વહેંચાયેલી છે તેની સરખામણી કરે છે. ઇતિહાસ દરેક ભૂતકાળની ડ્યુટી, તારીખો અને નોંધો સાથે યાદી આપે છે."},{titleEn:"Can I download a PDF report?",titleGu:"શું હું PDF અહેવાલ ડાઉનલોડ કરી શકું?",bodyEn:"Yes — every work type, the Monthly report, and each person's own history has a Download PDF option, the same as the manager sees. Pick a time period first, then download.",bodyGu:"હા — દરેક કામનો પ્રકાર, માસિક અહેવાલ, અને દરેક વ્યક્તિનો પોતાનો ઇતિહાસ, વ્યવસ્થાપક જુએ છે તે જ રીતે PDF ડાઉનલોડ વિકલ્પ ધરાવે છે. પહેલાં સમયગાળો પસંદ કરો, પછી ડાઉનલોડ કરો."}];function HelpPanel(e){var t=e.onClose,a=e.sections,r=e.onStartTour,n=e.onNavigate,o=a||ke,i=useLang().t;useEscToClose(t);var c=_slicedToArray(l(null),2),s=c[0],d=c[1];return React.createElement("div",{role:"dialog","aria-modal":"true","aria-label":i("Top Questions","ટોચના પ્રશ્નો"),className:"modal-backdrop",style:{position:"fixed",inset:0,background:"#00000066",display:"flex",alignItems:"center",justifyContent:"center",zIndex:90,padding:16},onClick:t},React.createElement("div",{onClick:e=>e.stopPropagation(),className:"modal-card",style:{background:"var(--bg-surface)",borderRadius:12,width:560,maxWidth:"100%",maxHeight:"86vh",display:"flex",flexDirection:"column",overflow:"hidden",boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}},React.createElement("div",{style:{padding:"16px 20px",borderBottom:"1px solid var(--border-soft)",display:"flex",justifyContent:"space-between",alignItems:"center"}},React.createElement("div",{className:"disp gu",style:{fontSize:16,fontWeight:700}},i("Top Questions","ટોચના પ્રશ્નો")),Re
