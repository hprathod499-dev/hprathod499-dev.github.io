<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/service-worker.js").then((reg) => {
        reg.update().catch(() => {});
      }).catch((e) => console.warn("SW registration failed", e));
    });
    // A newer version was downloaded in the background (the page opened from the copy on this device).
    // Still starting up -> switch now. Otherwise: show a small "Refresh" chip, and switch by itself the
    // next time the app goes to the background (never while a change is waiting to be saved).
    var nbUpdateReady = false;
    var nbReload = function () { if (!window.__nbUnsaved) location.reload(); };
    navigator.serviceWorker.addEventListener("message", function (e) {
      if (!e.data || e.data.type !== "nb-update") return;
      if (!window.__nbAppReady && performance.now() < 6000 && !/^\/crime(\/|$)/.test(location.pathname)) { nbReload(); return; }
      if (nbUpdateReady) return;
      nbUpdateReady = true;
      var gu = false; try { gu = localStorage.getItem("nb_lang") === "gu"; } catch (x) {}
      var b = document.createElement("button");
      b.type = "button"; b.setAttribute("data-nb-update", "");
      b.textContent = gu ? "નવું વર્ઝન તૈયાર — રિફ્રેશ કરો" : "New version ready — Refresh";
      b.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:100001;border:none;border-radius:20px;padding:9px 16px;font:600 13px Inter,sans-serif;background:var(--btn-dark-bg,#222);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer";
      b.onclick = nbReload;
      document.body.appendChild(b);
    });
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden" && nbUpdateReady) nbReload(); });
    // look for a new version whenever the app comes back to the screen
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({ type: "nb-check-update" });
    });
  }
</script>
